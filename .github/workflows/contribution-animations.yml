name: Contribution animations

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-contribution-graph.svg?palette=github-light&color_snake=purple
            dist/snake-contribution-graph-dark.svg?palette=github-dark&color_snake=purple

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Generate 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep the night-rainbow theme
        run: cp profile-3d-contrib/profile-night-rainbow.svg dist/3d-contribution-graph.svg

      - name: Keep SVGs for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contribution-animations
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Only this job can write to the repo, so the generators never hold a write token.
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch SVGs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contribution-animations
          path: dist

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
